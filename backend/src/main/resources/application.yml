spring:
  application:
    name: flexislot-backend
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST:localhost}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080
  servlet:
    context-path: /api

# JWT
jwt:
  secret: FlexiSlotJwtSecretKeyForSigningMustBeAtLeast256BitsLongForHS256Algorithm
  expiration-ms: 86400000

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    com.flexislot: DEBUG
    org.springframework.security: DEBUG

# Paystack Configuration
paystack:
  secret-key: key-goes-here
  public-key: key-goes-here
